<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Futebol de Botão — Arena Nevex</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.fut-wrap{max-width:1000px;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
.canvas-box{background:#134a1a;border:4px solid rgba(255,255,255,.12);border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);position:relative;width:100%;max-width:900px}
canvas{display:block;width:100%;height:auto;background:#1b5e20}
.hud{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.score-box{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 16px;font-weight:700;min-width:140px;text-align:center}
.score-box.red{border-color:#ff3b30;color:#ff6655}
.score-box.blue{border-color:#00e5ff;color:#66f0ff}
.controls{font-size:12px;color:var(--muted);text-align:center}
.kbd{background:rgba(255,255,255,.1);padding:2px 6px;border-radius:6px;border:1px solid rgba(255,255,255,.15);font-weight:700}
</style>
</head>
<body>
<div class="bg-grid"></div>
<header class="topbar">
  <div class="logo">⚽ FUTEBOL <span>BOTÃO</span></div>
  <div class="top-actions">
    <button class="icon-btn" onclick="location.href='/'">🏠</button>
    <button id="btnSound" class="icon-btn">🔊</button>
  </div>
</header>

<section id="s-modes" class="screen active">
  <div class="card" style="max-width:520px">
    <h2>⚽ Futebol — inspirado no HaxBall</h2>
    <p class="muted">Física estilo HaxBall: disco liso, chute com Espaço. 1v1 ou 2v2.</p>
    <label>Seu nome <input id="f-name" maxlength="12" placeholder="Ex: Davi" value=""></label>
    <label>Modo
      <select id="f-mode">
        <option value="online">🌐 Online — 1v1/2v2 (criar sala)</option>
        <option value="local">📱 Mesmo teclado — WASD vs Setas</option>
        <option value="bot">🤖 Vs Bot (local)</option>
      </select>
    </label>
    <div id="online-area">
      <div style="display:flex;gap:8px;margin-top:10px">
        <button id="f-create" class="btn primary" style="flex:1">CRIAR SALA</button>
        <button id="f-join-btn" class="btn secondary" style="flex:1">ENTRAR</button>
      </div>
      <div id="join-box" class="hidden" style="margin-top:10px">
        <input id="f-code" maxlength="6" placeholder="Código ABC123" style="text-transform:uppercase">
        <button id="f-join-do" class="btn primary" style="width:100%;margin-top:8px">ENTRAR NA SALA</button>
      </div>
      <p id="f-error" class="error"></p>
      <div id="f-lobby" class="hidden" style="margin-top:12px;background:rgba(255,255,255,.04);padding:12px;border-radius:12px">
        <p>Sala: <b id="f-lcode"></b> • <span id="f-lcount"></span></p>
        <div id="f-llist" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0"></div>
        <label>Time
          <select id="f-team"><option value="auto">Auto</option><option value="red">🔴 Vermelho</option><option value="blue">🔵 Azul</option></select>
        </label>
        <button id="f-start" class="btn primary hidden" style="width:100%;margin-top:8px">▶️ INICIAR</button>
        <p id="f-wait" class="muted">Aguardando jogadores...</p>
      </div>
    </div>
    <div id="local-area" class="hidden" style="margin-top:10px">
      <button id="f-local-start" class="btn primary" style="width:100%">▶️ COMEÇAR LOCAL</button>
      <p class="muted" style="font-size:12px;margin-top:6px">WASD + Espaço (Vermelho) vs Setas + Enter (Azul)</p>
    </div>
    <button class="btn ghost" style="width:100%;margin-top:10px" onclick="location.href='/'">Voltar à Arena</button>
  </div>
</section>

<section id="s-game" class="screen">
  <div class="fut-wrap">
    <div class="hud">
      <div class="score-box red">🔴 <span id="score-red">0</span> — <span id="name-red">Vermelho</span></div>
      <div class="score-box">⏱️ <span id="timer">03:00</span></div>
      <div class="score-box blue"><span id="name-blue">Azul</span> — <span id="score-blue">0</span> 🔵</div>
    </div>
    <div class="canvas-box"><canvas id="c" width="900" height="500"></canvas></div>
    <div class="controls">
      <span class="kbd">W</span><span class="kbd">A</span><span class="kbd">S</span><span class="kbd">D</span> + <span class="kbd">ESPAÇO</span> (ou <span class="kbd">F</span>) chuta &nbsp;|&nbsp; 
      <span class="kbd">↑</span><span class="kbd">←</span><span class="kbd">↓</span><span class="kbd">→</span> + <span class="kbd">ENTER</span> (Azul local) &nbsp;|&nbsp; <span id="my-team-info"></span>
    </div>
    <div style="display:flex;gap:8px">
      <button id="btn-leave" class="btn ghost">Sair</button>
      <button id="btn-reset" class="btn secondary hidden">Reiniciar</button>
    </div>
  </div>
</section>

<div id="toast" class="toast hidden"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
// ===== ARENA FUTEBOL — HaxBall inspired, física simplificada =====
const socket=io();
const $=id=>document.getElementById(id);
const toast=(m,t=2500)=>{const e=$('toast');e.textContent=m;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),t);};
const show=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');};
let soundOn=localStorage.getItem('bombSound')!=='off';
$('btnSound').textContent=soundOn?'🔊':'🔇';
$('btnSound').onclick=()=>{soundOn=!soundOn;localStorage.setItem('bombSound',soundOn?'on':'off');$('btnSound').textContent=soundOn?'🔊':'🔇';};

let mode='online', room=null, myId=null, online=false, isHost=false;
let keys={w:false,a:false,s:false,d:false,up:false,left:false,down:false,right:false,space:false,enter:false};

$('f-mode').onchange=e=>{
  mode=e.target.value;
  $('online-area').classList.toggle('hidden', mode!=='online');
  $('local-area').classList.toggle('hidden', mode==='online');
};
$('f-join-btn').onclick=()=> $('join-box').classList.toggle('hidden');
$('f-code').addEventListener('input',e=>e.target.value=e.target.value.toUpperCase());

// ONLINE
$('f-create').onclick=()=>{
  const n=$('f-name').value.trim()||'Jogador';
  socket.emit('createFutebolRoom',{playerName:n},res=>{
    if(res.error) return $('f-error').textContent=res.error;
    room=res.room; online=true; showLobby();
  });
};
$('f-join-do').onclick=()=>{
  const n=$('f-name').value.trim()||'Jogador';
  const code=$('f-code').value.trim().toUpperCase();
  if(!code) return $('f-error').textContent='Digite código';
  socket.emit('joinFutebolRoom',{playerName:n,code},res=>{
    if(res.error) return $('f-error').textContent=res.error;
    room=res.room; online=true; showLobby();
  });
};
$('f-team').onchange=e=>{
  socket.emit('futebolChooseTeam',{team:e.target.value});
};
$('f-start').onclick=()=> socket.emit('futebolStart');
function showLobby(){
  $('f-lobby').classList.remove('hidden');
  $('f-lcode').textContent=room.code;
  renderLobby();
}
function renderLobby(){
  $('f-lcount').textContent=room.players.length+'/4';
  const l=$('f-llist'); l.innerHTML='';
  room.players.forEach(p=>{
    const d=document.createElement('div');
    const col=p.team==='red'?'🔴':'🔵';
    d.style.cssText='background:rgba(255,255,255,.06);padding:6px 10px;border-radius:999px;font-size:13px';
    d.textContent=col+' '+p.name+(p.id===myId?' (você)':'');
    l.appendChild(d);
  });
  const me=room.players.find(p=>p.id===myId);
  isHost=!!me?.isAdmin;
  $('f-start').classList.toggle('hidden', !isHost || room.players.length<2);
  $('f-wait').textContent = room.players.length<2 ? 'Aguardando 2+ jogadores...' : (isHost?'Você é host — inicie':'Aguardando host iniciar');
  $('f-team').value=me?.teamPref||'auto';
}
socket.on('connect',()=>myId=socket.id);
socket.on('futebolRoomUpdate',r=>{room=r; if($('s-modes').classList.contains('active')||$('f-lobby').parentElement) renderLobby();});
socket.on('futebolStarted',data=>{
  online=true; sharedState=data.state; startGame(data);
});
socket.on('futebolState',s=>{ if(online) sharedState=s; });
socket.on('futebolError',m=>toast(m));

// LOCAL
$('f-local-start').onclick=()=>{
  online=false; room=null;
  startGame({state:null, mode});
};

// CANVAS & FÍSICA
const canvas=$('c'), ctx=canvas.getContext('2d');
const W=900,H=500;
let sharedState=null;
let localState=null;
let gameRunning=false;
let scores={red:0,blue:0}, timerSec=180;
let animId=null;

function startGame(data){
  show('s-game');
  scores={red:0,blue:0}; timerSec=180;
  $('score-red').textContent='0'; $('score-blue').textContent='0';
  if(online && data.state){
    sharedState=data.state;
    const me=room.players.find(p=>p.id===myId);
    $('my-team-info').textContent = me ? `Você: ${me.team==='red'?'🔴 Vermelho':'🔵 Azul'}` : '';
  } else {
    // local: cria estado local
    sharedState=createLocalState(mode);
    $('my-team-info').textContent = mode==='bot'?'Você 🔴 vs Bot 🔵' : 'WASD 🔴 vs Setas 🔵';
  }
  gameRunning=true;
  if(!online) loopLocal();
  else loopOnline();
  startTimer();
}

function createLocalState(m){
  // 2 players local: red at left, blue at right
  return {
    ball:{x:W/2,y:H/2,vx:0,vy:0},
    players:[
      {id:'p1', team:'red', x:180,y:H/2,vx:0,vy:0, name:'Vermelho'},
      {id:'p2', team:'blue', x:W-180,y:H/2,vx:0,vy:0, name: m==='bot'?'Bot':'Azul'}
    ],
    score:{red:0,blue:0}
  };
}

function loopLocal(){
  if(!gameRunning) return;
  // input handling para local
  if(mode==='bot'){
    // p1 = WASD+space, p2 = bot IA
    applyInput(sharedState.players[0], {up:keys.w, down:keys.s, left:keys.a, right:keys.d, kick:keys.space});
    botAI(sharedState.players[1], sharedState.ball);
  } else {
    applyInput(sharedState.players[0], {up:keys.w, down:keys.s, left:keys.a, right:keys.d, kick:keys.space});
    applyInput(sharedState.players[1], {up:keys.up, down:keys.down, left:keys.left, right:keys.right, kick:keys.enter});
  }
  physicsTick(sharedState);
  const g=checkGoal(sharedState);
  if(g){ scores[g]++; $('score-'+g).textContent=scores[g]; sharedState.ball={x:W/2,y:H/2,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4}; sharedState.players[0].x=180; sharedState.players[0].y=H/2; sharedState.players[1].x=W-180; sharedState.players[1].y=H/2; }
  draw(sharedState);
  animId=requestAnimationFrame(loopLocal);
}
function loopOnline(){
  if(!gameRunning) return;
  // envia input ao servidor
  const input={up:keys.w||keys.up, down:keys.s||keys.down, left:keys.a||keys.left, right:keys.d||keys.right, kick:keys.space||keys.enter};
  socket.emit('futebolInput', input);
  // desenha estado compartilhado (recebido via futebolState)
  if(sharedState) draw(sharedState);
  // mostra placar do servidor
  if(sharedState?.score){ $('score-red').textContent=sharedState.score.red; $('score-blue').textContent=sharedState.score.blue; }
  animId=requestAnimationFrame(loopOnline);
}

function applyInput(p, inp){
  const acc=0.7;
  if(inp.up) p.vy-=acc;
  if(inp.down) p.vy+=acc;
  if(inp.left) p.vx-=acc;
  if(inp.right) p.vx+=acc;
  // limite e damping será no physicsTick
  p._kick=!!inp.kick;
}
function botAI(bot, ball){
  // simples: persegue bola
  const dx=ball.x - bot.x, dy=ball.y - bot.y;
  const dist=Math.hypot(dx,dy);
  if(dist>12){
    bot.vx += (dx/dist)*0.5;
    bot.vy += (dy/dist)*0.5;
  }
  bot._kick = dist<28;
}
function physicsTick(state){
  const PR=22, BR=13;
  // players
  state.players.forEach(p=>{
    p.vx*=0.94; p.vy*=0.94;
    const sp=Math.hypot(p.vx,p.vy);
    if(sp>7){ p.vx*=7/sp; p.vy*=7/sp; }
    p.x+=p.vx; p.y+=p.vy;
    // walls (exceto gol)
    const goalH=100, goalY0=H/2-goalH/2, goalY1=H/2+goalH/2;
    if(p.x-PR<0){
      if(p.y>goalY0 && p.y<goalY1){ /* dentro gol, deixa passar */ }
      else { p.x=PR; p.vx*=-0.6; }
    }
    if(p.x+PR>W){
      if(p.y>goalY0 && p.y<goalY1){} else { p.x=W-PR; p.vx*=-0.6; }
    }
    if(p.y-PR<0){ p.y=PR; p.vy*=-0.6; }
    if(p.y+PR>H){ p.y=H-PR; p.vy*=-0.6; }
  });
  // player-player colisao
  if(state.players.length>=2){
    const a=state.players[0], b=state.players[1];
    let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy);
    if(d<PR*2 && d>0){
      const overlap=(PR*2 - d)/2;
      const nx=dx/d, ny=dy/d;
      a.x-=nx*overlap; a.y-=ny*overlap; b.x+=nx*overlap; b.y+=ny*overlap;
      // troca velocidade
      const tvx=a.vx, tvy=a.vy; a.vx=b.vx*0.8; a.vy=b.vy*0.8; b.vx=tvx*0.8; b.vy=tvy*0.8;
    }
  }
  // ball
  const ball=state.ball;
  ball.vx*=0.995; ball.vy*=0.995;
  ball.x+=ball.vx; ball.y+=ball.vy;
  // ball walls
  const goalH=100, goalY0=H/2-goalH/2, goalY1=H/2+goalH/2;
  if(ball.y-BR<0){ ball.y=BR; ball.vy*=-0.9; }
  if(ball.y+BR>H){ ball.y=H-BR; ball.vy*=-0.9; }
  if(ball.x-BR<0){
    if(ball.y>goalY0 && ball.y<goalY1){ /* gol */ } else { ball.x=BR; ball.vx*=-0.9; }
  }
  if(ball.x+BR>W){
    if(ball.y>goalY0 && ball.y<goalY1){} else { ball.x=W-BR; ball.vx*=-0.9; }
  }
  // player-ball
  state.players.forEach(p=>{
    let dx=ball.x-p.x, dy=ball.y-p.y, d=Math.hypot(dx,dy);
    if(d<PR+BR && d>0){
      const nx=dx/d, ny=dy/d;
      const overlap=PR+BR - d;
      ball.x+=nx*overlap*0.6; ball.y+=ny*overlap*0.6;
      // impulso
      const kick = p._kick ? 6 : 2.5;
      ball.vx += nx*kick + p.vx*0.4;
      ball.vy += ny*kick + p.vy*0.4;
      // limita
      const sp=Math.hypot(ball.vx,ball.vy);
      if(sp>10){ ball.vx*=10/sp; ball.vy*=10/sp; }
    }
  });
}
function checkGoal(state){
  const goalH=100, goalY0=H/2-goalH/2, goalY1=H/2+goalH/2;
  const b=state.ball;
  if(b.x < -12 && b.y>goalY0 && b.y<goalY1) return 'blue'; // gol azul? bola entrou gol esquerdo => ponto azul? Na real gol vermelho à esquerda, azul marca se entra esquerda. Vamos definir: esquerda é gol vermelho, quem marca é azul
  if(b.x > W+12 && b.y>goalY0 && b.y<goalY1) return 'red';
  return null;
}
function draw(state){
  // campo
  ctx.fillStyle='#1b5e20'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=3;
  ctx.strokeRect(2,2,W-4,H-4);
  ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2,H/2,70,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(W/2,H/2,5,0,Math.PI*2); ctx.fill();
  // áreas
  ctx.strokeRect(0,H/2-60,90,120); ctx.strokeRect(W-90,H/2-60,90,120);
  // gols
  ctx.fillStyle='#0d2a10'; ctx.fillRect(-2,H/2-50,12,100); ctx.fillRect(W-10,H/2-50,12,100);
  ctx.strokeStyle='#fff'; ctx.strokeRect(-2,H/2-50,12,100); ctx.strokeRect(W-10,H/2-50,12,100);
  // ball
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(state.ball.x, state.ball.y, 13,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#111'; ctx.lineWidth=1; ctx.stroke();
  // players
  state.players.forEach(p=>{
    ctx.fillStyle= p.team==='red'?'#ff3b30':'#00bfff';
    ctx.beginPath(); ctx.arc(p.x,p.y,22,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
    // nome pequeno
    ctx.fillStyle='#fff'; ctx.font='10px Space Grotesk'; ctx.textAlign='center';
    const name = p.name|| (p.team==='red'?'🔴':'🔵');
    ctx.fillText(name.slice(0,8), p.x, p.y+36);
  });
}
function startTimer(){
  clearInterval(window._futTimer);
  window._futTimer=setInterval(()=>{
    if(!gameRunning) return;
    timerSec--;
    const m=String(Math.floor(timerSec/60)).padStart(2,'0');
    const s=String(timerSec%60).padStart(2,'0');
    $('timer').textContent=m+':'+s;
    if(timerSec<=0){ clearInterval(window._futTimer); gameRunning=false; const w= scores.red>scores.blue?'🔴 Vermelho venceu!': scores.blue>scores.red?'🔵 Azul venceu!':'Empate!'; $('timer').textContent=w; toast(w,3000); }
  },1000);
}

// teclas
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='w') keys.w=true;
  if(k==='a') keys.a=true;
  if(k==='s') keys.s=true;
  if(k==='d') keys.d=true;
  if(k==='arrowup') keys.up=true;
  if(k==='arrowleft') keys.left=true;
  if(k==='arrowdown') keys.down=true;
  if(k==='arrowright') keys.right=true;
  if(k===' ') keys.space=true;
  if(k==='f') keys.space=true;
  if(k==='enter') keys.enter=true;
});
window.addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k==='w') keys.w=false;
  if(k==='a') keys.a=false;
  if(k==='s') keys.s=false;
  if(k==='d') keys.d=false;
  if(k==='arrowup') keys.up=false;
  if(k==='arrowleft') keys.left=false;
  if(k==='arrowdown') keys.down=false;
  if(k==='arrowright') keys.right=false;
  if(k===' ') keys.space=false;
  if(k==='f') keys.space=false;
  if(k==='enter') keys.enter=false;
});
// mobile touch
let touchDir={x:0,y:0};
canvas.addEventListener('touchstart',e=>{
  const t=e.touches[0];
  touchDir.x=t.clientX; touchDir.y=t.clientY;
  keys.space=true;
});
canvas.addEventListener('touchend',()=>{keys.space=false;});

$('btn-leave').onclick=()=>{
  gameRunning=false; cancelAnimationFrame(animId); clearInterval(window._futTimer);
  if(online) socket.emit('leaveRoom');
  location.reload();
};
$('btn-reset').onclick=()=>{
  if(online) socket.emit('futebolRestart');
  else { sharedState.ball={x:W/2,y:H/2,vx:0,vy:0}; draw(sharedState); }
};
</script>
</body>
</html>
